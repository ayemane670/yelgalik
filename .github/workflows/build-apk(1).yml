name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (required by Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install project dependencies
        run: npm install

      # NOTE: this build uses a static export so the resulting APK works
      # standalone without needing your Vercel URL to be filled in yet.
      # Pages that need the server (API routes) will still call your
      # deployed backend once you set NEXT_PUBLIC_API_BASE in repo secrets.
      - name: Add Android platform (first run only, safe to repeat)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: yelgalik-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
